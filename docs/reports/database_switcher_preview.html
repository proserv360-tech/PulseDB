<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PulseDB — Database Switcher Preview</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.47.0/tabler-icons.min.css" />
<style>
  :root{
    --bg:#0e1116; --surface:#161b22; --surface2:#1c2230; --border:#2a3140;
    --text:#e6edf3; --muted:#8b949e; --faint:#6e7681;
    --accent:#58a6ff; --accent-bg:#132133; --accent-border:#1f4b7a;
    --ok:#3fb950; --ok-bg:#122117; --ok-border:#1f5130; --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; padding:32px 16px;}
  .wrap{max-width:720px; margin:0 auto;}
  h1{font-size:20px; font-weight:500; margin:0 0 4px;}
  .sub{color:var(--muted); font-size:14px; margin:0 0 24px;}
  .toolbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:14px;}
  .conn{display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:8px 12px;}
  .dbbtn{display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:8px 12px; cursor:pointer; color:var(--text);}
  .seg{display:inline-flex; gap:4px; background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:4px; margin-bottom:14px;}
  .segBtn{border:none; background:transparent; border-radius:6px; padding:6px 12px; font-size:13px; color:var(--muted); cursor:pointer;}
  .segBtn.on{background:var(--surface2); color:var(--text);}
  .panel{background:var(--surface); border:1px solid var(--border); border-radius:12px; overflow:hidden;}
  .search{padding:12px 14px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:8px;}
  .search input{flex:1; border:none; background:transparent; height:24px; font-size:14px; color:var(--text); outline:none;}
  .row{display:flex; align-items:center; gap:12px; padding:11px 14px; cursor:pointer; border-bottom:1px solid var(--border);}
  .row:last-child{border-bottom:none;}
  .foot{padding:10px 14px; border-top:1px solid var(--border); background:#11161d; font-size:12px; color:var(--muted); display:flex; align-items:center; gap:8px;}
  code{font-family:var(--mono); font-size:12px; color:var(--text);}
  .toast{margin-top:12px; display:none; align-items:center; gap:8px; background:var(--ok-bg); color:var(--ok); border:1px solid var(--ok-border); border-radius:8px; padding:10px 12px; font-size:13px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Switch database on the same server</h1>
  <p class="sub">Preview — pick any database on the connected host without re-adding a connection. Works across Postgres, MySQL, and MongoDB.</p>

  <div class="toolbar">
    <div class="conn">
      <i class="ti ti-server" style="font-size:18px; color:var(--muted);"></i>
      <div style="line-height:1.2;">
        <div id="connName" style="font-size:14px; font-weight:500;">Supabase Prod</div>
        <div id="connHost" style="font-size:12px; color:var(--faint);">aws-1-ap-northeast-2 · 6543</div>
      </div>
    </div>
    <i class="ti ti-chevron-right" style="font-size:16px; color:var(--faint);"></i>
    <button class="dbbtn" id="dbBtn">
      <i class="ti ti-database" style="font-size:18px; color:var(--accent);"></i>
      <span id="dbBtnLabel" style="font-size:14px; font-weight:500;">postgres</span>
      <i class="ti ti-chevron-down" style="font-size:16px; color:var(--faint);"></i>
    </button>
  </div>

  <div class="seg" id="seg">
    <button class="segBtn on" data-engine="postgres">PostgreSQL</button>
    <button class="segBtn" data-engine="mysql">MySQL</button>
    <button class="segBtn" data-engine="mongodb">MongoDB</button>
  </div>

  <div class="panel">
    <div class="search">
      <i class="ti ti-search" style="font-size:16px; color:var(--faint);"></i>
      <input id="dbSearch" type="text" placeholder="Filter databases on this server" />
    </div>
    <div id="dbList"></div>
    <div class="foot">
      <i class="ti ti-code" style="font-size:15px;"></i>
      <span>Enumerated via</span>
      <code id="enumQuery"></code>
    </div>
  </div>

  <div class="toast" id="toast">
    <i class="ti ti-check" style="font-size:16px;"></i>
    <span id="toastMsg"></span>
  </div>
</div>

<script>
(function(){
  var DATA = {
    postgres: { conn:{name:'Supabase Prod', host:'aws-1-ap-northeast-2 · 6543'},
      query:"SELECT datname FROM pg_database WHERE datistemplate=false AND datallowconn", active:'postgres',
      dbs:[{name:'postgres',size:'128 MB',objs:'42 tables'},{name:'analytics',size:'2.4 GB',objs:'18 tables'},{name:'reporting',size:'910 MB',objs:'27 tables'},{name:'app_staging',size:'64 MB',objs:'40 tables'}] },
    mysql: { conn:{name:'MySQL Primary', host:'db.internal · 3306'},
      query:"SHOW DATABASES", active:'app',
      dbs:[{name:'app',size:'512 MB',objs:'31 tables'},{name:'analytics',size:'1.1 GB',objs:'12 tables'},{name:'sales',size:'340 MB',objs:'22 tables'},{name:'information_schema',size:'—',objs:'system'}] },
    mongodb: { conn:{name:'Mongo Cluster', host:'cluster0.mongodb · 27017'},
      query:"db.adminCommand({ listDatabases: 1 })", active:'app',
      dbs:[{name:'app',size:'780 MB',objs:'9 collections'},{name:'events',size:'3.2 GB',objs:'4 collections'},{name:'logs',size:'6.8 GB',objs:'2 collections'},{name:'admin',size:'—',objs:'system'}] }
  };
  var engine='postgres', el=function(id){return document.getElementById(id);};
  function render(){
    var d=DATA[engine];
    el('connName').textContent=d.conn.name; el('connHost').textContent=d.conn.host;
    el('dbBtnLabel').textContent=d.active; el('enumQuery').textContent=d.query;
    var q=(el('dbSearch').value||'').toLowerCase(), list=el('dbList'); list.innerHTML='';
    d.dbs.filter(function(x){return x.name.toLowerCase().indexOf(q)>-1;}).forEach(function(x){
      var a=x.name===d.active, row=document.createElement('div');
      row.className='row'; if(a) row.style.background='var(--accent-bg)';
      row.onmouseenter=function(){if(!a)row.style.background='var(--surface2)';};
      row.onmouseleave=function(){if(!a)row.style.background='transparent';};
      row.innerHTML='<i class="ti ti-database" style="font-size:17px;color:'+(a?'var(--accent)':'var(--faint)')+';"></i>'+
        '<div style="flex:1;min-width:0;"><div style="font-size:14px;font-weight:500;color:'+(a?'var(--accent)':'var(--text)')+';">'+x.name+'</div>'+
        '<div style="font-size:12px;color:var(--faint);">'+x.objs+' · '+x.size+'</div></div>'+
        (a?'<span style="font-size:12px;color:var(--accent);">✓ active</span>':'<span style="font-size:12px;color:var(--faint);">switch</span>');
      row.onclick=function(){ if(a) return; DATA[engine].active=x.name; render(); toast('Switched to '+x.name+' — reloading dashboards for this database'); };
      list.appendChild(row);
    });
  }
  var tt; function toast(m){ el('toastMsg').textContent=m; var t=el('toast'); t.style.display='flex'; clearTimeout(tt); tt=setTimeout(function(){t.style.display='none';},2600); }
  Array.prototype.forEach.call(document.querySelectorAll('.segBtn'),function(b){
    b.onclick=function(){ engine=b.getAttribute('data-engine');
      Array.prototype.forEach.call(document.querySelectorAll('.segBtn'),function(x){x.classList.toggle('on',x===b);});
      el('dbSearch').value=''; render(); };
  });
  el('dbSearch').oninput=render; el('dbBtn').onclick=function(){el('dbSearch').focus();};
  render();
})();
</script>
</body>
</html>
