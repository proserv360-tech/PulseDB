[build-system]
requires = ["setuptools>=45", "wheel", "setuptools-scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "pulsedb-sdk"
version = "0.1.0"
description = "Lightweight Python SDK for PulseDB observability"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "PulseDB Team" }]
requires-python = ">=3.9"
dependencies = ["httpx>=0.25"]
keywords = ["observability", "monitoring", "sdk", "pulsedb"]

[project.urls]
Homepage = "https://pulsedb.example.com"
Documentation = "https://pulsedb.example.com/docs"
Repository = "https://github.com/pulsedb/python-sdk"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.20", "respx>=0.20"]
fastapi = ["fastapi>=0.100", "starlette>=0.20"]
django = ["django>=3.2"]
flask = ["flask>=2.0"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["pulsedb_sdk*"]

[tool.setuptools.package-data]
pulsedb_sdk = ["py.typed"]
