name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  type-check:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install all dependencies
        run: npm install --no-audit

      - name: Type check shared types
        run: cd shared/types && npx tsc --noEmit

      - name: Type check shared validators
        run: cd shared/validators && npx tsc --noEmit

      - name: Type check backend
        run: cd backend && npx tsc --noEmit

      - name: Strict check curated backend .js (B4)
        run: cd backend && npx tsc -p tsconfig.checkjs.json --noEmit

      - name: Type check frontend
        run: cd frontend && npx tsc --noEmit

  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install all dependencies
        run: npm install --no-audit

      - name: Lint frontend
        run: cd frontend && npx eslint src/ --max-warnings 50

      - name: Build frontend
        run: cd frontend && npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || '' }}

      - name: Check backend syntax
        run: cd backend && npx tsc --noEmit

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint-and-build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install all dependencies
        run: npm install --no-audit

      - name: Run frontend tests
        run: cd frontend && npm test -- --run --reporter=verbose

      - name: Run backend tests
        run: cd backend && npm test

      # ── Silent-failure ratchet ──────────────────────────────────────────
      # Fails if swallowed errors or leaked internal error messages grow past
      # the baseline in scripts/report-silent-failures.ts. Lower the baseline
      # as sites are fixed; never raise it.
      - name: Silent-failure ratchet (backend)
        run: cd backend && npm run report:silent -- --ci

  security:
    name: Security Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for secrets in code
        run: |
          # Fail if any .env files with real values are committed
          if git ls-files | grep -E '\.env$|\.env\.local$|\.env\.production$' | grep -v '.example'; then
            echo "ERROR: Real .env files should not be committed!"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install all dependencies
        run: npm install --no-audit

      # ── Production-dep CVE gate ─────────────────────────────────────────
      # Wave A task A2: this gate is now blocking on HIGH+. Dev-dependency
      # findings stay advisory below — they don't ship to production.
      - name: Audit frontend production dependencies (blocking)
        run: cd frontend && npm audit --omit=dev --audit-level=high

      - name: Audit backend production dependencies (blocking)
        run: cd backend && npm audit --omit=dev --audit-level=high

      - name: Audit SDK production dependencies (blocking)
        run: cd sdk && npm audit --omit=dev --audit-level=high

      # ── Dev-dep CVE advisory ────────────────────────────────────────────
      # Useful signal but not release-blocking — dev deps don't ship.
      - name: Audit frontend dev dependencies (advisory)
        run: cd frontend && npm audit --audit-level=high || true

      - name: Audit backend dev dependencies (advisory)
        run: cd backend && npm audit --audit-level=high || true

  python:
    name: Python Lint, Test & Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/requirements.txt

      - name: Install Python dependencies
        run: cd python && pip install -r requirements.txt

      - name: Lint with ruff
        run: cd python && pip install ruff && ruff check .

      - name: Run Python tests
        run: cd python && python -m pytest tests/ -v

      # ── A2 Python CVE gate ──────────────────────────────────────────────
      - name: pip-audit (blocking on HIGH+)
        run: |
          pip install pip-audit
          cd python && pip-audit --strict --disable-pip --requirement requirements.txt

      # ── A2 Python SAST advisory ─────────────────────────────────────────
      # bandit is noisy on intentionally-dynamic code; keep advisory until
      # we triage the baseline.
      - name: bandit (advisory)
        run: |
          pip install bandit
          cd python && bandit -r . -ll || true

  go-sdk:
    name: Go SDK lint, test & audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: sdk/go/go.sum

      - name: Vet
        run: cd sdk/go && go vet ./...

      - name: Test
        run: cd sdk/go && go test ./...

      # ── A2 Go CVE gate ──────────────────────────────────────────────────
      - name: govulncheck (blocking)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          cd sdk/go && govulncheck ./...

      # ── A2 Go SAST advisory ─────────────────────────────────────────────
      - name: gosec (advisory)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          cd sdk/go && gosec ./... || true
