# .github/workflows/perf.yml
# C7 — nightly performance smoke against a staging deployment.
# Manual full-load runs are triggered with workflow_dispatch.

name: Performance

on:
  schedule:
    - cron: '23 5 * * *'  # 05:23 UTC nightly (off-peak)
  workflow_dispatch:
    inputs:
      target:
        description: 'BASE_URL to load against'
        required: true
        default: 'https://staging.pulsedb.example.com'
      scenario:
        description: 'k6 scenario file under bench/k6/'
        required: true
        default: 'smoke.js'

jobs:
  k6:
    name: k6 smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Run k6 smoke
        env:
          BASE_URL: ${{ github.event.inputs.target || vars.PERF_TARGET || 'http://localhost:5000' }}
          SMOKE: '1'
          SDK_KEY: ${{ secrets.PERF_SDK_KEY }}
          CRON_SECRET: ${{ secrets.PERF_CRON_SECRET }}
          TOKEN: ${{ secrets.PERF_TOKEN }}
        run: |
          set -e
          script=${{ github.event.inputs.scenario || 'smoke.js' }}
          k6 run bench/k6/$script
